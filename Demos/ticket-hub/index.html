<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ticket-hub · 工单中台（在线演示）</title>
<script>
/* 演示模式：拦截 fetch，把 API 请求映射到静态 mock JSON。数据为虚构示例，刷新即复位。 */
(function () {
  const realFetch = window.fetch.bind(window);
  const MOCKS = [
    [/^\/api\/index/,        'mock/index.json'],
    [/^\/api\/env$/,         'mock/env.json'],
    [/^\/api\/pulse/,        'mock/pulse.json'],
    [/^\/api\/quota/,        'mock/quota.json'],
    [/^\/api\/git-status/,   'mock/git-status.json'],
    [/^\/api\/journal/,      'mock/journal.json'],
    [/^\/api\/docs/,         'mock/docs.json'],
    [/^\/api\/activity\?project=DEMO/, 'mock/activity-DEMO.json'],
    [/^\/api\/queue\?project=DEMO/,    'mock/queue-DEMO.json']
  ];
  window.fetch = function (url, opts) {
    const u = typeof url === 'string' ? url : url.url;
    if (u.startsWith('/api/')) {
      const t = u.match(/^\/api\/ticket\?id=([A-Za-z0-9-]+)/);
      if (t) return realFetch('mock/tickets/' + t[1] + '.json');
      for (const [re, file] of MOCKS) {
        if (re.test(u)) return realFetch(file);
      }
      if (opts && opts.method && opts.method !== 'GET') {
        const body = (u === '/api/save')
          ? { ok: true, demo: true }
          : { ok: false, error: '在线演示模式：此操作需要本地服务端（派发 / 回流 / git 同步仅在桌面版可用）' };
        return Promise.resolve(new Response(JSON.stringify(body), { headers: { 'Content-Type': 'application/json' } }));
      }
      return Promise.resolve(new Response(JSON.stringify({ ok: false, demo: true }), { headers: { 'Content-Type': 'application/json' } }));
    }
    return realFetch(url, opts);
  };
  window.addEventListener('DOMContentLoaded', function () {
    const bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#1A1D21;color:#fff;font-size:13px;padding:8px 16px;text-align:center;opacity:.92';
    bar.innerHTML = '在线演示 · 数据为虚构示例项目《像素牧场》· 改动仅存于当前页面，刷新即复位 · <a href="../../ticket-hub.html" style="color:#8AB4F8">← 返回项目介绍</a>';
    document.body.appendChild(bar);
  });
})();
</script>
<link rel="icon" href="favicon.ico" />
<link rel="stylesheet" href="style.css" />
</head>
